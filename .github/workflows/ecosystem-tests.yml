name: Ecosystem tests
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ecosystem:
    timeout-minutes: 30
    name: ecosystem
    runs-on: 'ubuntu-latest'
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      BUN_VERSION: 1.3.13
      BUN_SHA256: 79c0771fa8b92c33aae41e15a0e0d307ea99d0e2f00317c71c6c53237a78e25a
      DENO_VERSION: v2.9.5
      DENO_SHA256: 8b010a3b1a4a0188a67cdb8a7a27348b2a501af78aec7fc74f2ace167368d530
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # --node-versions finds 20 and 24 in the tool cache; 22, set up last, runs the build and the runner
      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.34.5'

      # node-yarn-classic and node-yarn-pnp pick their yarn version through corepack
      - name: Enable corepack yarn
        run: corepack enable yarn

      - name: Set up Bun
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "$BUN_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bun-linux-x64/bun" --version

      - name: Set up Deno
        run: |
          curl -fsSL -o "$RUNNER_TEMP/deno.zip" "https://dl.deno.land/release/${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "$DENO_SHA256  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          mkdir -p "$HOME/.deno/bin"
          unzip -q "$RUNNER_TEMP/deno.zip" -d "$HOME/.deno/bin"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version

      - name: Install Chromium
        working-directory: ecosystem-tests/browser-vite
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright-core install --with-deps chromium

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run ecosystem tests
        run: pnpm test:ecosystem --skip-build --jobs 3 --node-versions 20,22,24
