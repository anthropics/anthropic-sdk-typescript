name: Changelog
on:
  pull_request:
    branches:
      - 'synced/published'
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  changelog:
    name: changelog
    runs-on: 'ubuntu-latest'
    if: |-
      github.repository_owner == 'anthropics' && github.repository != 'anthropics/anthropic-sdk-typescript' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Check that the pull request changes the CHANGELOG.md of each package it changes
        run: |
          missing=""
          check() {
            if git diff --quiet HEAD^1 HEAD -- "$1/CHANGELOG.md" &&
              ! git diff --quiet HEAD^1 HEAD -- "$@" ':(exclude).version-manifest.json' ':(exclude)scripts/mock-spec.json.gz'; then
              missing="$missing $1/CHANGELOG.md"
            fi
          }
          check '.' ':(exclude)packages/vertex-sdk' ':(exclude)packages/bedrock-sdk' ':(exclude)packages/foundry-sdk' ':(exclude)packages/aws-sdk' ':(exclude)packages/google-cloud-sdk'
          check 'packages/vertex-sdk'
          check 'packages/bedrock-sdk'
          check 'packages/foundry-sdk'
          check 'packages/aws-sdk'
          check 'packages/google-cloud-sdk'
          if [ -n "$missing" ]; then
            echo "::error::This pull request changes packages without a line in their own changelog:$missing. A release leaves out a package whose changelog has no new section. Add your line to each. The skip-changelog label turns this check off for the whole pull request, and a listed package with no new section then waits for a later line."
            exit 1
          fi

      - name: Check that the pull request changes CHANGELOG.md
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD -- ':(glob)**/CHANGELOG.md')"
          if [ -z "$changed" ]; then
            echo "::error::Add your line to CHANGELOG.md, or add the skip-changelog label to this pull request."
            exit 1
          fi
